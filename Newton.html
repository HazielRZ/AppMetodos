<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Newton-Raphson - AppMétodos</title>
    <link href="css/styles.css" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
    <script defer src="https://unpkg.com/mathlive"></script>
</head>
<body>
<div class="container">
    <header>
        <a class="back-link" href="index.html">← Volver al Menú</a>
        <h1>Método de Newton-Raphson</h1>
    </header>

    <main>
        <section class="input-section">
            <div class="form-group">
                <label>Función f(x):</label>
                <math-field class="math-input" id="mathInput" virtual-keyboard-mode="onfocus"></math-field>
            </div>

            <div class="controls-row">
                <div class="form-group">
                    <label for="inputX0">Valor Inicial (X0):</label>
                    <input id="inputX0" step="any" type="number" value="1">
                </div>
                <div class="form-group">
                    <label for="tolerance">Tolerancia (%):</label>
                    <input id="tolerance" step="0.001" type="number" value="0.01">
                </div>
            </div>

            <button class="btn-primary" data-method="newton" id="btnSolve">Calcular Raíz</button>
        </section>

        <section class="results-section" id="resultsSection" style="display: none;">
            <div class="metrics-summary">
                <h3>Raíz Aproximada: <span class="highlight" id="finalRoot">-</span></h3>
                <p>Iteraciones: <span id="totalIter">-</span> | Error: <span id="finalError">-</span>%</p>
            </div>

            <div class="table-container">
                <table id="resultsTable">
                    <thead>
                    <tr>
                        <th>Iter</th>
                        <th>Xi</th>
                        <th>f(Xi)</th>
                        <th>f'(Xi)</th>
                        <th>Xi+1</th>
                        <th>Error (%)</th>
                    </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<script src="Js/Bisection.js"></script>
</body>
</html>
