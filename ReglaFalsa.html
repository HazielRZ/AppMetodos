<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Falsa Posición - AppMétodos</title>
    <link href="css/styles.css" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
    <script defer src="https://unpkg.com/mathlive"></script>
</head>
<body>
<div class="container">
    <header>
        <a class="back-link" href="index.html">← Volver al Menú</a>
        <h1>Método de la Falsa Posición</h1>
    </header>

    <main>
        <section class="input-section">
            <div class="form-group">
                <label>Función f(x):</label>
                <math-field class="math-input" id="mathInput" virtual-keyboard-mode="onfocus"></math-field>
            </div>

            <div class="controls-row">
                <div class="form-group">
                    <label for="inputXi">Límite Inferior (Xi):</label>
                    <input id="inputXi" step="any" type="number" value="0">
                </div>
                <div class="form-group">
                    <label for="inputXu">Límite Superior (Xu):</label>
                    <input id="inputXu" step="any" type="number" value="1">
                </div>
                <div class="form-group">
                    <label for="tolerance">Tolerancia (%):</label>
                    <input id="tolerance" step="0.05" type="number" value="0.5">
                </div>
            </div>

            <button class="btn-primary" data-method="falsaposicion" id="btnSolve">Calcular Raíz</button>
        </section>

        <section class="results-section" id="resultsSection" style="display: none;">
            <div class="metrics-summary">
                <h3>Raíz Aproximada: <span class="highlight" id="finalRoot">-</span></h3>
                <p>Iteraciones: <span id="totalIter">-</span> | Error: <span id="finalError">-</span>%</p>
            </div>

            <div class="table-container">
                <table id="resultsTable">
                    <thead>
                    <tr>
                        <th>Iter</th>
                        <th>Xi</th>
                        <th>Xu</th>
                        <th>Xr</th>
                        <th>f(Xi)</th>
                        <th>f(Xr)</th>
                        <th>Error (%)</th>
                    </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<script src="Js/Bisection.js"></script>
</body>
<footer>
    <p>
        <a href="https://jigsaw.w3.org/css-validator/check/referer">
            <img alt="¡CSS Válido!"
                 src="https://jigsaw.w3.org/css-validator/images/vcss-blue"
                 style="border:0;width:88px;height:31px"/>
        </a>
    </p>
</footer>
</html>
